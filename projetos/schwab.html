      <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Simulador Espinopélvico (SRS-Schwab)</h2>

        <button type="button" class="lumi-btn scenario-btn is-selected" id="btn-normal">Normal</button>
        <button type="button" class="lumi-btn scenario-btn" id="btn-compensated">Perda LL Compensada</button>
        <button type="button" class="lumi-btn scenario-btn" id="btn-decompensated">Descompensação Franca</button>
      </div>
    </div>
    
    <div class="equation-banner">
      <span>Morfologia Fixa: </span>
      <span class="eq-val pi" id="eq-pi">PI 55°</span>
      <span>=</span>
      <span class="eq-val pt" id="eq-pt">PT 14°</span>
      <span>+</span>
      <span class="eq-val ss" id="eq-ss">SS 41°</span>
    </div>
  </div>

  <!-- Canvas Simulation Viewport -->
  <div class="widget-viewport" id="viewport-zone">
    <div style="position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden;">
      <canvas id="simCanvas" style="display: block; width: 100%; height: 100%;" tabindex="0"></canvas>
    </div>
  </div>

  <!-- Schwab Modifier Cards -->
  <div class="metrics-grid" id="metrics-zone">
    <div class="metric-card" id="card-mismatch">
      <div class="metric-header">
        <span class="metric-title">Mismatch PI - LL</span>
        <span class="schwab-badge badge-0" id="badge-mismatch">0</span>
      </div>
      <div class="metric-value-row">
        <span class="metric-num" id="val-mismatch">0°</span>
        <span class="metric-unit" id="target-mismatch">(Alvo: &lt;10°)</span>
      </div>
    </div>

    <div class="metric-card" id="card-pt">
      <div class="metric-header">
        <span class="metric-title">Versão Pélvica (PT)</span>
        <span class="schwab-badge badge-0" id="badge-pt">0</span>
      </div>
      <div class="metric-value-row">
        <span class="metric-num" id="val-pt">14°</span>
        <span class="metric-unit">(Alvo: &lt;20°)</span>
      </div>
    </div>

    <div class="metric-card" id="card-sva">
      <div class="metric-header">
        <span class="metric-title">Eixo Sagital (SVA)</span>
        <span class="schwab-badge badge-0" id="badge-sva">0</span>
      </div>
      <div class="metric-value-row">
        <span class="metric-num" id="val-sva">15 mm</span>
        <span class="metric-unit">(Alvo: &lt;40mm)</span>
      </div>
    </div>
  </div>

  <!-- Interactive Controls Deck -->
  <div class="control-deck">
    
    <div class="auto-mode-toggle">
      <span style="font-size: 13px; font-weight: 600;">Mecanismo Compensatório da Pelve</span>
      <label class="lumi-checkbox-label">
        <input type="checkbox" id="toggle-auto" checked>
        <span>Autocompensação (Retroversão Pélvica)</span>
      </label>
    </div>

    <div class="control-row">
      <label class="control-label" for="slider-pi">Incidência Pélvica (PI - Fixo)</label>
      <div class="lumi-slider-container">
        <input type="range" id="slider-pi" class="lumi-slider" data-key="pi" min="35" max="85" value="55" style="--progress: 40%;">
        <div id="slider-pi-val" class="lumi-slider-value">55°</div>
      </div>
    </div>

    <div class="control-row">
      <label class="control-label" for="slider-ll">Lordose Lombar Real (LL)</label>
      <div class="lumi-slider-container">
        <input type="range" id="slider-ll" class="lumi-slider" data-key="ll" min="10" max="85" value="55" style="--progress: 60%;">
        <div id="slider-ll-val" class="lumi-slider-value">55°</div>
      </div>
    </div>

    <div class="control-row" id="row-pt-slider">
      <label class="control-label" for="slider-pt">Versão Pélvica (PT - Manual)</label>
      <div class="lumi-slider-container">
        <input type="range" id="slider-pt" class="lumi-slider" data-key="pt" min="-5" max="45" value="14" style="--progress: 38%;" disabled>
        <div id="slider-pt-val" class="lumi-slider-value">14°</div>
      </div>
    </div>

  </div>

</div>

<script>
  const state = {
    pi: 55,
    ll: 55,
    pt: 14.3,
    ss: 40.7,
    sva: 15,
    autoCompensate: true,
    animating: false
  };

  let canvas = document.getElementById('simCanvas');
  let ctx = canvas ? canvas.getContext('2d') : null;
  let animReqId = null;

  function getCssVar(name) {
    if (!name) return '';
    const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
    return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
  }

  function computeBiometrics() {
    if (state.autoCompensate) {
      const ptBasal = 0.26 * state.pi;
      const llLoss = Math.max(0, state.pi - state.ll);
      const ptMax = 38.0;
      
      // Retroversão pélvica compensatória aumenta o PT para manter C7 sobre o sacro
      state.pt = Math.min(ptMax, ptBasal + llLoss * 0.75);
      state.ss = state.pi - state.pt;

      // SVA aumenta quando a perda de LL excede a capacidade de retroversão pélvica
      const compensatedByPT = (state.pt - ptBasal) * 1.15;
      const uncompensatedDeficit = Math.max(0, (state.pi - state.ll) - compensatedByPT);
      state.sva = Math.round(15 + uncompensatedDeficit * 3.8);
    } else {
      state.ss = state.pi - state.pt;
      const ptBasal = 0.26 * state.pi;
      const uncompensatedDeficit = (state.pi - state.ll) - (state.pt - ptBasal);
      state.sva = Math.round(15 + uncompensatedDeficit * 3.8);
    }
  }

  function updateReadouts() {
    computeBiometrics();

    document.getElementById('eq-pi').textContent = `PI ${Math.round(state.pi)}°`;
    document.getElementById('eq-pt').textContent = `PT ${Math.round(state.pt)}°`;
    document.getElementById('eq-ss').textContent = `SS ${Math.round(state.ss)}°`;

    const piSlider = document.getElementById('slider-pi');
    const llSlider = document.getElementById('slider-ll');
    const ptSlider = document.getElementById('slider-pt');

    if (piSlider && !state.animating) {
      piSlider.value = Math.round(state.pi);
      piSlider.style.setProperty('--progress', ((state.pi - piSlider.min) / (piSlider.max - piSlider.min) * 100) + '%');
      document.getElementById('slider-pi-val').textContent = `${Math.round(state.pi)}°`;
    }

    if (llSlider && !state.animating) {
      llSlider.value = Math.round(state.ll);
      llSlider.style.setProperty('--progress', ((state.ll - llSlider.min) / (llSlider.max - llSlider.min) * 100) + '%');
      document.getElementById('slider-ll-val').textContent = `${Math.round(state.ll)}°`;
    }

    if (ptSlider) {
      ptSlider.disabled = state.autoCompensate;
      ptSlider.value = Math.round(state.pt);
      ptSlider.style.setProperty('--progress', ((state.pt - ptSlider.min) / (ptSlider.max - ptSlider.min) * 100) + '%');
      document.getElementById('slider-pt-val').textContent = `${Math.round(state.pt)}°`;
    }

    const mismatch = Math.round(state.pi - state.ll);
    document.getElementById('val-mismatch').textContent = `${mismatch}°`;
    updateBadge('badge-mismatch', Math.abs(mismatch), 10, 20);

    const ptVal = Math.round(state.pt);
    document.getElementById('val-pt').textContent = `${ptVal}°`;
    updateBadge('badge-pt', ptVal, 20, 30);

    const svaVal = state.sva;
    document.getElementById('val-sva').textContent = `${svaVal} mm`;
    updateBadge('badge-sva', svaVal, 40, 95);
  }

  function updateBadge(badgeId, val, threshold1, threshold2) {
    const badge = document.getElementById(badgeId);
    if (!badge) return;

    badge.classList.remove('badge-0', 'badge-plus', 'badge-plus-plus');
    if (val < threshold1) {
      badge.textContent = '0';
      badge.classList.add('badge-0');
    } else if (val <= threshold2) {
      badge.textContent = '+';
      badge.classList.add('badge-plus');
    } else {
      badge.textContent = '++';
      badge.classList.add('badge-plus-plus');
    }
  }

  function renderBiomechanicalCanvas() {
    if (!canvas || !ctx) return;

    const box = canvas.parentElement;
    const w = box.clientWidth || 600;
    const h = box.clientHeight || 350;
    const dpr = window.devicePixelRatio || 1;

    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
    }

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const colorOnSurface = getCssVar('--on-surface') || '#000000';
    const colorVariant = getCssVar('--on-surface-variant') || '#666666';
    const colorPI = getCssVar('--chart-1') || '#2575fc';
    const colorPT = getCssVar('--chart-10') || '#c84288';
    const colorSS = getCssVar('--chart-3') || '#228a49';
    const colorSurfaceDim = getCssVar('--surface-dim') || '#f2f0f0';
    const colorError = getCssVar('--error') || '#de2d29';

    // ORIENTAÇÃO ANATÔMICA SAGITAL:
    // Esquerda = POSTERIOR | Direita = ANTERIOR
    // O eixo bicoxofemoral (cabeças femorais) fica ANTERIOR (à direita) ao centro do platô sacral (S1) quando PT > 0.
    const femoralX = w * 0.48;
    const femoralY = h - 60;
    const pelvisR = 76; // Distância do centro da cabeça femoral ao centro do platô S1

    const ptRad = (state.pt * Math.PI) / 180;
    const ssRad = (state.ss * Math.PI) / 180;
    const llRad = (state.ll * Math.PI) / 180;

    // Coordenadas do centro do platô S1:
    // Como a cabeça femoral é ANTERIOR (+X) ao sacro quando PT > 0, S1 fica POSTERIOR (-X) à cabeça femoral.
    const s1X = femoralX - pelvisR * Math.sin(ptRad);
    const s1Y = femoralY - pelvisR * Math.cos(ptRad);

    // Platô Sacral (S1):
    // Inclina-se para baixo e para a frente (direita = anterior).
    // Portanto, a borda ANTERIOR (direita) é mais baixa (+Y) e a borda POSTERIOR (esquerda) é mais alta (-Y).
    const s1Width = 40;
    const s1Half = s1Width / 2;
    const plateDx = s1Half * Math.cos(ssRad);
    const plateDy = s1Half * Math.sin(ssRad);

    const s1PostX = s1X - plateDx;
    const s1PostY = s1Y - plateDy; // Canto póstero-superior de S1 (referência do SVA)
    const s1AntX = s1X + plateDx;
    const s1AntY = s1Y + plateDy;  // Canto ântero-superior de S1

    // --- MARCADORES DE ORIENTAÇÃO (POSTERIOR / ANTERIOR) ---
    ctx.font = "600 11px 'Google Sans Code', monospace";
    ctx.fillStyle = colorVariant;
    ctx.fillText("← POSTERIOR", 18, 24);
    const antLabel = "ANTERIOR →";
    ctx.fillText(antLabel, w - ctx.measureText(antLabel).width - 18, 24);

    // --- LINHA DE SOLO / REFERÊNCIA BASE ---
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = colorVariant;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(25, femoralY + 32);
    ctx.lineTo(w - 25, femoralY + 32);
    ctx.stroke();
    ctx.setLineDash([]);

    // --- DESENHO DO CONTORNO PÉLVICO E SACRO ---
    ctx.fillStyle = colorSurfaceDim;
    ctx.strokeStyle = colorOnSurface;
    ctx.lineWidth = 1.8;

    // Contorno estilizado do sacro e pelve até o acetábulo (cabeça femoral)
    ctx.beginPath();
    ctx.moveTo(s1PostX, s1PostY);
    ctx.lineTo(s1AntX, s1AntY);
    ctx.quadraticCurveTo(femoralX + 10, (s1AntY + femoralY) / 2, femoralX, femoralY);
    const sacrumTipX = s1PostX - 18 * Math.cos(ssRad - 0.3);
    const sacrumTipY = s1PostY + 42 * Math.sin(ssRad + 0.5);
    ctx.quadraticCurveTo(sacrumTipX, sacrumTipY, s1PostX, s1PostY);
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.stroke();

    // --- DESENHO DO PLATÔ SACRAL (S1) ---
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = colorSS;
    ctx.beginPath();
    ctx.moveTo(s1PostX, s1PostY);
    ctx.lineTo(s1AntX, s1AntY);
    ctx.stroke();

    // Linha horizontal de referência no centro de S1 para o ângulo SS
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = colorSS;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(s1X, s1Y);
    ctx.lineTo(s1X + 42, s1Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // --- LINHA PERPENDICULAR AO PLATÔ S1 (PARA DEFINIÇÃO DO PI) ---
    // O vetor do platô para a frente é (+cos(ss), +sin(ss)).
    // A normal apontando para baixo e para trás é (-sin(ss), +cos(ss)).
    const perpLen = 58;
    const perpX = s1X - perpLen * Math.sin(ssRad);
    const perpY = s1Y + perpLen * Math.cos(ssRad);

    ctx.lineWidth = 1.8;
    ctx.strokeStyle = colorPI;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(s1X, s1Y);
    ctx.lineTo(perpX, perpY);
    ctx.stroke();
    ctx.setLineDash([]);

    // --- LINHA S1 AO EIXO BICOXOFEMORAL (CAB. FEMORAL) ---
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = colorPT;
    ctx.beginPath();
    ctx.moveTo(s1X, s1Y);
    ctx.lineTo(femoralX, femoralY);
    ctx.stroke();

    // --- LINHA VERTICAL DE REFERÊNCIA NO EIXO BICOXOFEMORAL (PARA PT) ---
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = colorPT;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(femoralX, femoralY);
    ctx.lineTo(femoralX, s1Y - 15);
    ctx.stroke();
    ctx.setLineDash([]);

    // --- CABEÇA FEMORAL (EIXO BICOXOFEMORAL) ---
    ctx.fillStyle = colorSurfaceDim;
    ctx.strokeStyle = colorOnSurface;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(femoralX, femoralY, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = colorOnSurface;
    ctx.beginPath();
    ctx.arc(femoralX, femoralY, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "600 10px 'Google Sans Code', monospace";
    ctx.fillStyle = colorVariant;
    ctx.fillText("Eixo Bicoxofemoral", femoralX - 48, femoralY + 26);

    // --- COLUNA VERTEBRAL (LORDOSE LOMBAR E CIFOSE TORÁCICA ATÉ C7) ---
    // SVA é medido horizontalmente do canto póstero-superior do platô S1 (s1PostX) até a linha de prumo de C7.
    const svaPxOffset = state.sva * 1.15; // Escala visual (mm -> px)
    const C7_X = s1PostX + svaPxOffset;
    const C7_Y = s1Y - 160;

    // A coluna sai perpendicularmente ao platô S1 (para cima e para a frente: +sin(ss), -cos(ss))
    // e curva-se para trás de acordo com a Lordose Lombar (LL)
    const lordosisDepth = (state.ll - 15) * 0.65;
    const ctrl1X = s1X + Math.sin(ssRad) * 45 - lordosisDepth * 0.35;
    const ctrl1Y = s1Y - Math.cos(ssRad) * 45;
    const ctrl2X = Math.min(s1X, C7_X) - lordosisDepth * 0.85;
    const ctrl2Y = (s1Y + C7_Y) * 0.52;

    ctx.lineWidth = 5.5;
    ctx.strokeStyle = colorOnSurface;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s1X, s1Y);
    ctx.bezierCurveTo(ctrl1X, ctrl1Y, ctrl2X, ctrl2Y, C7_X, C7_Y);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // Corpo vertebral de C7
    ctx.fillStyle = colorOnSurface;
    ctx.beginPath();
    ctx.arc(C7_X, C7_Y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "bold 12px 'Google Sans Code', monospace";
    ctx.fillStyle = colorOnSurface;
    ctx.fillText("C7", C7_X - 8, C7_Y - 10);

    // --- LINHA DE PRUMO DE C7 E MEDIDA DO SVA (REFERÊNCIA: S1 PÓSTERO-SUPERIOR) ---
    const isSvaHigh = state.sva >= 40;
    const svaColor = isSvaHigh ? colorError : colorOnSurface;

    // Linha de prumo descendo de C7
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = svaColor;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(C7_X, C7_Y);
    ctx.lineTo(C7_X, s1PostY + 25);
    ctx.stroke();

    // Linha de referência vertical no canto póstero-superior de S1
    ctx.strokeStyle = colorVariant;
    ctx.beginPath();
    ctx.moveTo(s1PostX, s1PostY - 35);
    ctx.lineTo(s1PostX, s1PostY + 15);
    ctx.stroke();
    ctx.setLineDash([]);

    // Ponto destacando o canto póstero-superior de S1
    ctx.fillStyle = colorSS;
    ctx.beginPath();
    ctx.arc(s1PostX, s1PostY, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Seta / Barra horizontal do SVA entre S1 póstero-superior e a linha de prumo de C7
    const svaMeasureY = s1PostY - 22;
    ctx.lineWidth = 2;
    ctx.strokeStyle = svaColor;
    ctx.beginPath();
    ctx.moveTo(s1PostX, svaMeasureY);
    ctx.lineTo(C7_X, svaMeasureY);
    ctx.stroke();

    // Pequenas hastes nas extremidades da cota do SVA
    ctx.beginPath();
    ctx.moveTo(s1PostX, svaMeasureY - 4);
    ctx.lineTo(s1PostX, svaMeasureY + 4);
    ctx.moveTo(C7_X, svaMeasureY - 4);
    ctx.lineTo(C7_X, svaMeasureY + 4);
    ctx.stroke();

    ctx.fillStyle = svaColor;
    ctx.font = "bold 11px 'Google Sans Code', monospace";
    const midSvaX = (s1PostX + C7_X) / 2;
    ctx.fillText(`SVA: ${state.sva}mm`, midSvaX - 28, svaMeasureY - 7);

    // --- ARCOS DE ÂNGULOS (SS, PT, PI) ---
    // 1. Arco SS (entre a horizontal 0 rad e o platô sacral +ssRad)
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = colorSS;
    ctx.beginPath();
    ctx.arc(s1X, s1Y, 26, 0, ssRad, false);
    ctx.stroke();
    ctx.font = "bold 11px 'Google Sans Code', monospace";
    ctx.fillStyle = colorSS;
    ctx.fillText(`SS ${Math.round(state.ss)}°`, s1X + 30, s1Y + 14);

    // 2. Arco PT (no eixo bicoxofemoral, entre a vertical -PI/2 e a linha para S1: -PI/2 - ptRad)
    ctx.strokeStyle = colorPT;
    ctx.beginPath();
    const angleVertUp = -Math.PI / 2;
    const angleFemToS1 = -Math.PI / 2 - ptRad;
    ctx.arc(femoralX, femoralY, 38, Math.min(angleVertUp, angleFemToS1), Math.max(angleVertUp, angleFemToS1));
    ctx.stroke();
    ctx.fillStyle = colorPT;
    ctx.fillText(`PT ${Math.round(state.pt)}°`, femoralX - 28, femoralY - 44);

    // 3. Arco PI (no centro de S1, entre a perpendicular ao platô e a linha S1-Fêmur)
    // Ângulo da perpendicular para baixo/trás: PI/2 + ssRad
    // Ângulo de S1 para a cabeça femoral: PI/2 - ptRad
    const angleS1ToFem = Math.PI / 2 - ptRad;
    const anglePerp = Math.PI / 2 + ssRad;
    ctx.strokeStyle = colorPI;
    ctx.beginPath();
    ctx.arc(s1X, s1Y, 28, angleS1ToFem, anglePerp, false);
    ctx.stroke();
    ctx.fillStyle = colorPI;
    ctx.fillText(`PI ${Math.round(state.pi)}°`, s1X - 48, s1Y + 38);

    ctx.restore();
  }

  function animateTo(targetPI, targetLL, targetPT, duration = 400) {
    state.animating = true;
    const startPI = state.pi;
    const startLL = state.ll;
    const startPT = state.pt;
    const startTime = performance.now();

    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const ease = 1 - Math.pow(1 - progress, 3);

      state.pi = startPI + (targetPI - startPI) * ease;
      state.ll = startLL + (targetLL - startLL) * ease;
      if (!state.autoCompensate && targetPT !== undefined) {
        state.pt = startPT + (targetPT - startPT) * ease;
      }

      updateViz();

      if (progress < 1) {
        animReqId = requestAnimationFrame(step);
      } else {
        state.animating = false;
        updateViz();
      }
    }

    if (animReqId) cancelAnimationFrame(animReqId);
    animReqId = requestAnimationFrame(step);
  }

  function updateViz() {
    updateReadouts();
    renderBiomechanicalCanvas();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.lumi-slider').forEach(slider => {
      slider.addEventListener('input', (e) => {
        if (state.animating) return;
        const val = parseFloat(e.target.value);
        const key = e.target.dataset.key;
        state[key] = val;

        const pct = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
        e.target.style.setProperty('--progress', pct + '%');
        const valBadge = document.getElementById(`${e.target.id}-val`);
        if (valBadge) valBadge.textContent = `${Math.round(val)}°`;

        updateViz();
      });
    });

    const toggleAuto = document.getElementById('toggle-auto');
    if (toggleAuto) {
      toggleAuto.addEventListener('change', (e) => {
        state.autoCompensate = e.target.checked;
        updateViz();
      });
    }

    const btnNormal = document.getElementById('btn-normal');
    const btnCompensated = document.getElementById('btn-compensated');
    const btnDecompensated = document.getElementById('btn-decompensated');

    function setActiveBtn(activeBtn) {
      [btnNormal, btnCompensated, btnDecompensated].forEach(btn => btn?.classList.remove('is-selected'));
      activeBtn?.classList.add('is-selected');
    }

    btnNormal?.addEventListener('click', () => {
      setActiveBtn(btnNormal);
      if (toggleAuto) toggleAuto.checked = true;
      state.autoCompensate = true;
      animateTo(55, 55);
    });

    btnCompensated?.addEventListener('click', () => {
      setActiveBtn(btnCompensated);
      if (toggleAuto) toggleAuto.checked = true;
      state.autoCompensate = true;
      animateTo(55, 32);
    });

    btnDecompensated?.addEventListener('click', () => {
      setActiveBtn(btnDecompensated);
      if (toggleAuto) toggleAuto.checked = true;
      state.autoCompensate = true;
      animateTo(55, 12);
    });

    window.addEventListener('resize', () => {
      renderBiomechanicalCanvas();
    });

    updateViz();
  });
</script>

</body>
</html>
